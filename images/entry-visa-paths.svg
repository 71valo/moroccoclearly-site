<svg viewBox="0 0 360 348">
  <rect width="360" height="348" fill="#FBF7F0"/>
  <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2330">Four results from the check</text>
  <rect x="24" y="44" width="312" height="50" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="68" font-family="sans-serif" font-size="14" font-weight="600" fill="#A8462A">1</text>
  <text x="68" y="68" font-family="sans-serif" font-size="14" fill="#1D2330">No visa step</text>
  <text x="68" y="86" font-family="sans-serif" font-size="12" fill="#4A4F5C">Read the sentence in both languages</text>
  <rect x="24" y="102" width="312" height="50" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="126" font-family="sans-serif" font-size="14" font-weight="600" fill="#A8462A">2</text>
  <text x="68" y="126" font-family="sans-serif" font-size="14" fill="#1D2330">E-visa</text>
  <text x="68" y="144" font-family="sans-serif" font-size="12" fill="#4A4F5C">The stay cap is not one number</text>
  <rect x="24" y="160" width="312" height="50" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="184" font-family="sans-serif" font-size="14" font-weight="600" fill="#24418F">3</text>
  <text x="68" y="184" font-family="sans-serif" font-size="14" fill="#1D2330">Travel authorisation</text>
  <text x="68" y="202" font-family="sans-serif" font-size="12" fill="#4A4F5C">A different paper from the e-visa</text>
  <rect x="24" y="218" width="312" height="50" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="242" font-family="sans-serif" font-size="14" font-weight="600" fill="#24418F">4</text>
  <text x="68" y="242" font-family="sans-serif" font-size="14" fill="#1D2330">Consular visa</text>
  <text x="68" y="260" font-family="sans-serif" font-size="12" fill="#4A4F5C">Filed at a consular post</text>
  <text x="180" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A4F5C">The note and the portal do not share</text>
  <text x="180" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A4F5C">one passport line. No stamp is named.</text>
  <text x="180" y="332" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A4F5C">Diagram drawn for Morocco, Clearly.</text>
</svg>
