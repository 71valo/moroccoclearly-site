<svg viewBox="0 0 360 400">
  <rect width="360" height="400" fill="#FBF7F0"/>
  <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2330">At the border</text>
  <rect x="24" y="44" width="312" height="52" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="66" font-family="sans-serif" font-size="14" font-weight="600" fill="#A8462A">1</text>
  <text x="68" y="66" font-family="sans-serif" font-size="14" fill="#1D2330">Foreign cash</text>
  <text x="68" y="84" font-family="sans-serif" font-size="12" fill="#4A4F5C">Declare it at arrival if it reaches the line</text>
  <rect x="24" y="104" width="312" height="52" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="126" font-family="sans-serif" font-size="14" font-weight="600" fill="#A8462A">2</text>
  <text x="68" y="126" font-family="sans-serif" font-size="14" fill="#1D2330">Goods you are carrying</text>
  <text x="68" y="144" font-family="sans-serif" font-size="12" fill="#4A4F5C">Green lane, or red if you have goods to declare</text>
  <rect x="24" y="164" width="312" height="52" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="186" font-family="sans-serif" font-size="14" font-weight="600" fill="#24418F">3</text>
  <text x="68" y="186" font-family="sans-serif" font-size="14" fill="#1D2330">Medicines for you</text>
  <text x="68" y="204" font-family="sans-serif" font-size="12" fill="#4A4F5C">Certificate, prescription, commitment</text>
  <rect x="24" y="224" width="312" height="52" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="246" font-family="sans-serif" font-size="14" font-weight="600" fill="#24418F">4</text>
  <text x="68" y="246" font-family="sans-serif" font-size="14" fill="#1D2330">A drone</text>
  <text x="68" y="264" font-family="sans-serif" font-size="12" fill="#4A4F5C">Declare it. Not a temporary import.</text>
  <rect x="24" y="284" width="312" height="52" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="44" y="306" font-family="sans-serif" font-size="14" font-weight="600" fill="#A8462A">5</text>
  <text x="68" y="306" font-family="sans-serif" font-size="14" fill="#1D2330">The way out</text>
  <text x="68" y="324" font-family="sans-serif" font-size="12" fill="#4A4F5C">Keep the paper. Declare the notes again.</text>
  <text x="180" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A4F5C">The two languages do not share one licence line.</text>
  <text x="180" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A4F5C">Diagram drawn for Morocco, Clearly.</text>
</svg>
