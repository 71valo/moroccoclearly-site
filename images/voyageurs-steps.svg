<svg viewBox="0 0 360 200">
  <rect width="360" height="200" fill="#FBF7F0"/>
  <rect x="16" y="36" width="96" height="110" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="64" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2330">Ticket</text>
  <text x="64" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">phone or</text>
  <text x="64" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">paper</text>
  <rect x="132" y="36" width="96" height="110" rx="8" fill="#F5EDE1" stroke="#E3D6C3"/>
  <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2330">Board</text>
  <text x="180" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">match the</text>
  <text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">train number</text>
  <rect x="248" y="36" width="96" height="110" rx="8" fill="#F5EDE1" stroke="#A8462A" stroke-width="2"/>
  <text x="296" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2330">Platform</text>
  <text x="296" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">follow the</text>
  <text x="296" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">signs</text>
  <text x="180" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4A4F5C">Do not trust a platform number from another website.</text>
