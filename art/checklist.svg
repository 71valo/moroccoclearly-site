)"><rect x="-7" y="-7" width="14" height="14" fill="#E08A63" style="mix-blend-mode:multiply"/><rect x="-7" y="-7" width="14" height="14" fill="#E08A63" style="mix-blend-mode:multiply" transform="rotate(45)"/></g><rect width="400" height="300" rx="22" filter="url(#grain)" opacity=".14" style="mix-blend-mode:multiply"/></svg>