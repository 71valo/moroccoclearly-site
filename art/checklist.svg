<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="presentation"><defs>
<pattern id="zellige" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(0)"><g fill="none" stroke="#A8462A" stroke-width="2.2" stroke-opacity=".55"><rect x="22" y="22" width="36" height="36"/><rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/><path d="M0 0 L14 14 M80 0 L66 14 M0 80 L14 66 M80 80 L66 66 M40 0 V8 M40 72 V80 M0 40 H8 M72 40 H80"/></g></pattern>
